# .github/workflows/cache-demo.yml
name: CI with Dependency Cache

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: cache-80e71fd

      - name: prime-cache-80e71fd
        run: |
          echo "Cache hit: ${{ steps.cache-step.outputs.cache-hit }}"
          if [ "${{ steps.cache-step.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache HIT — dependencies restored from cache-80e71fd"
          else
            echo "⚠️ Cache MISS — priming cache with key cache-80e71fd"
            # Simulate installing dependencies to prime the cache
            mkdir -p ~/.npm
            echo "primed" > ~/.npm/cache-marker.txt
          fi
